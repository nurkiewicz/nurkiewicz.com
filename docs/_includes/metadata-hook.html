<meta name="apple-itunes-app" content="app-id=1510899104">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ site.feed.path | absolute_url }}">
{% if page.lite_youtube %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lite-youtube-embed@0.3.4/src/lite-yt-embed.css">
  <script defer src="https://cdn.jsdelivr.net/npm/lite-youtube-embed@0.3.4/src/lite-yt-embed.js"></script>
{% endif %}
{% if page.lite_vimeo %}
  <script type="module" src="https://cdn.jsdelivr.net/npm/lite-vimeo-embed@0.3.0/+esm"></script>
{% endif %}
<style id="code-tab-width">
  pre,
  code {
    tab-size: 2;
  }
</style>
{% unless jekyll.environment == "production" %}
  {% include analytics/google.html %}
{% endunless %}
